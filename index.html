  <body>
    <div id="root">
      <!--
        Rendered before JavaScript loads, and replaced by React once it does.
        Anything that cannot run JavaScript (some crawlers, a failed bundle, a
        very slow connection) still gets a usable page rather than a blank one.
      -->
      <noscript>
        <div style="max-width: 640px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.6">
          <h1>PhotoSpec: passport and visa photo maker</h1>
          <p>
            PhotoSpec turns a phone photo into a compliant passport or visa photo: the
            right size, the right head height, a plain background and a printable sheet.
            All the work happens inside your browser, so your photo is never uploaded.
          </p>
          <p><strong>JavaScript is required</strong> to process photos, because the processing runs on your own device rather than on a server.</p>
          <p>Requirements by document:</p>
          <ul>
            <li><a href="./schengen-visa-photo/">Schengen visa photo (35 × 45 mm)</a></li>
            <li><a href="./uk-passport-photo/">UK passport photo (35 × 45 mm)</a></li>
            <li><a href="./us-passport-photo/">US passport photo (51 × 51 mm)</a></li>
            <li><a href="./india-passport-photo/">India passport photo (35 × 45 mm)</a></li>
            <li><a href="./canada-passport-photo/">Canada passport photo (50 × 70 mm)</a></li>
          </ul>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
